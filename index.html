/* ── Toss Design System ── */

// 항목 추가/삭제 시점 기준으로 특정 연/월에 활성 여부 판단
// 추가: addedAt 기록된 달부터 보임 / 삭제: removedAt 기록된 달까지 보이고 다음달부터 안보임
function isItemActive(item,year,month){
  if(item.addedAt){
    var da=new Date(item.addedAt);
    if(!isNaN(da)){var ay=da.getFullYear(),am=da.getMonth();if(year<ay||(year===ay&&month<am))return false;}
  }
  if(item.removedAt){
    var dr=new Date(item.removedAt);
    if(!isNaN(dr)){var ry=dr.getFullYear(),rm=dr.getMonth();if(year>ry||(year===ry&&month>rm))return false;}
  }
  return true;
}
function activeItems(arr,year,month){return(arr||[]).filter(function(it){return isItemActive(it,year,month);});}

var LOAN_BASE={rate:3.977,totalInstallments:480,startInstallment:10,baseMonth:{year:2026,month:4},baseBalance:244273746,monthlyPayment:1026286,basePrincipal:216007,baseInterest:810279,autoTransferUntil:"2027.09"};
function calcLoan(cfg,year,month,allData){
  var base=cfg||LOAN_BASE;
  var diff=(year-base.baseMonth.year)*12+(month-base.baseMonth.month);
  var inst=base.startInstallment+diff;
  if(inst<1||inst>base.totalInstallments)return null;
  var r=base.rate/100/12;
  if(diff<=0){
    // 기준월 이전: 근사식 (기준월 자체는 설정값 그대로)
    var bal0=N(base.baseBalance,0)+N(base.basePrincipal,0)*Math.abs(diff);
    var intr0=Math.round(bal0*r);
    var prin0=Math.round(N(base.monthlyPayment,0)-intr0);
    if(diff===0){bal0=N(base.baseBalance,0);prin0=N(base.basePrincipal,0);intr0=N(base.baseInterest,0);}
    return{installment:inst,monthlyPayment:N(base.monthlyPayment,0),principal:Math.round(prin0),interest:Math.round(intr0),balance:Math.round(bal0),remaining:base.totalInstallments-inst};
  }
  // 기준월 이후: 매달 실제 입력(수기) 또는 자동계산 값을 그대로 누적해서 잔금을 계산.
  // 가계부 작성 페이지에서 입력한 월상환금_amt/납부원금_amt/대출이자_amt 가 있으면 그 값을 그대로 쓰고,
  // 없으면 (이전 잔금 기준) 자동계산값을 쓴다 — 그 결과가 다음 달 계산의 기초가 된다.
  var bal=N(base.baseBalance,0);
  var y=base.baseMonth.year,m=base.baseMonth.month;
  var pay=N(base.monthlyPayment,0),prin=N(base.basePrincipal,0),intr=N(base.baseInterest,0);
  var ad=allData||{};
  for(var i=1;i<=diff;i++){
    m++; if(m>11){m=0;y++;}
    var md=ad[y+"-"+m]||{};
    pay=md["월상환금_amt"]!==undefined?N(md["월상환금_amt"],N(base.monthlyPayment,0)):N(base.monthlyPayment,0);
    intr=md["대출이자_amt"]!==undefined?N(md["대출이자_amt"],0):Math.round(bal*r);
    prin=md["납부원금_amt"]!==undefined?N(md["납부원금_amt"],0):Math.round(pay-intr);
    bal=bal-prin;
  }
  return{installment:inst,monthlyPayment:Math.round(pay),principal:Math.round(prin),interest:Math.round(intr),balance:Math.round(bal),remaining:base.totalInstallments-inst};
}

function compute(yArg,mArg){
  var s=STATE,year=(yArg!==undefined?yArg:s.year),month=(mArg!==undefined?mArg:s.month),mKey=year+"-"+month,md=s.allData[mKey]||{},cfg=s.settings.loan||LOAN_BASE;
  function g(f,fb){return md[f]!==undefined?md[f]:fb;}
  var wS=N(g("wifeSalary",0),0),hS=N(g("husbandSalary",0),0);
  var exTog=activeItems(s.settings.husband.expenseToggle,year,month);
  var t1=g("tteok1Active",false),t2=g("tteok2Active",false);
  var t1a=t1?N(g("tteok1Amt",(exTog[0]||{}).amount||0),(exTog[0]||{}).amount||0):0;
  var t2a=t2?N(g("tteok2Amt",(exTog[1]||{}).amount||0),(exTog[1]||{}).amount||0):0;
  var wInc=activeItems(s.settings.wife.incomeToggle,year,month)[0]||null;
  var hInc=activeItems(s.settings.husband.incomeToggle,year,month)[0]||null;
  var wAddActive=wInc?g(wInc.id+"_active",false):false,wAddAmt=(wInc&&wAddActive)?N(g(wInc.id+"_amt",wInc.amount),wInc.amount):0;
  var hAddActive=hInc?g(hInc.id+"_active",false):false,hAddAmt=(hInc&&hAddActive)?N(g(hInc.id+"_amt",hInc.amount),hInc.amount):0;
  var wT=wS+wAddAmt,hT=hS+hAddAmt,totI=wT+hT;
  // 주담대: 가계부 작성 페이지의 월상환금_amt/납부원금_amt/대출이자_amt 수기 입력이 있으면
  // 그 값을 그대로 쓰고, 없으면 설정의 기준값을 토대로 자동계산한다. (calcLoan이 누적 처리)
  var li=calcLoan(cfg,year,month,s.allData);
  var lPay=li?li.monthlyPayment:N(cfg.monthlyPayment,0);
  var lP=li?li.principal:N(cfg.basePrincipal,0),lI=li?li.interest:N(cfg.baseInterest,0),lB=li?li.balance:N(cfg.baseBalance,0);

  function parseExtra(key){try{var v=g(key,null);return v?JSON.parse(v):[];}catch(e){return[];}}

  var wExtra=parseExtra("extraItems_wife");

  function sumArr(arr,defaultFor){

  });
  wrap.appendChild(saveBtn);

    if(!mpwCur){mpwMsg.textContent="현재 비밀번호를 입력해 주세요.";mpwMsg.style.color="#F04452";return;}
    if(simpleHash2(mpwCur)!==curHash){mpwMsg.textContent="현재 비밀번호가 틀렸어요.";mpwMsg.style.color="#F04452";return;}
    if(!mpwV1){mpwMsg.textContent="새 비밀번호를 입력해 주세요.";mpwMsg.style.color="#F04452";return;}
    if(mpwV1.length<4){mpwMsg.textContent="4자리 이상 입력해 주세요.";mpwMsg.style.color="#F04452";return;}
    if(mpwV1!==mpwV2){mpwMsg.textContent="새 비밀번호가 일치하지 않아요.";mpwMsg.style.color="#F04452";return;}
    var nh=simpleHash2(mpwV1);
    saveLS("hh_master_hash",nh);
    fbSet("masterHash",{hash:nh});
    mpwMsg.textContent="✅ 접속 비밀번호가 변경됐어요!";mpwMsg.style.color="#0F9648";
    mpwCurInp.value="";mpwInp.value="";mpwInp2.value="";mpwCur="";mpwV1="";mpwV2="";
    setTimeout(function(){mpwMsg.textContent="";},3000);
  });
  var masterCard=document.createElement("div");masterCard.className="toss-card";
  masterCard.appendChild(h("div",{style:{fontSize:"16px",fontWeight:"700",marginBottom:"6px"}},"🔑 접속 비밀번호"));
  masterCard.appendChild(h("div",{style:{fontSize:"13px",color:"#8B95A1",marginBottom:"14px",lineHeight:"1.6"}},"URL을 알아도 이 비밀번호 없이 접근 불가해요. 나와 남편이 공유하는 비밀번호예요."));
  var mpwCurInp=h("input",{type:"password",style:{width:"100%",boxSizing:"border-box",background:"#F9FAFB",border:"1.5px solid #E5E8EB",borderRadius:"10px",color:"#191F28",fontSize:"16px",padding:"12px 14px",outline:"none"},placeholder:"현재 접속 비밀번호"});
  mpwCurInp.addEventListener("input",function(e){mpwCur=e.target.value;});
  masterCard.appendChild(h("div",{style:{fontSize:"13px",color:"#8B95A1",fontWeight:"600",marginBottom:"6px"}},"현재 비밀번호"));
  masterCard.appendChild(mpwCurInp);
  masterCard.appendChild(h("div",{style:{fontSize:"13px",color:"#8B95A1",fontWeight:"600",margin:"10px 0 6px"}},"새 비밀번호"));
  masterCard.appendChild(mpwInp);
  masterCard.appendChild(h("div",{style:{fontSize:"13px",color:"#8B95A1",fontWeight:"600",margin:"10px 0 6px"}},"비밀번호 확인"));
  masterCard.appendChild(mpwInp2);
  masterCard.appendChild(mpwMsg);
  masterCard.appendChild(mpwBtn);
  return h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}},masterCard);
}

/* ── MONTH PICKER */
function renderMonthPicker(year,month,onSel,onClose){
  var py=year;
  var wrap=document.createElement("div");wrap.style.cssText="background:#fff;border-radius:16px;padding:16px;margin-top:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);position:relative;z-index:10;";
  function rb(){
    wrap.innerHTML="";
    var yr=document.createElement("div");yr.style.cssText="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;";
    yr.appendChild(arrowBtn("‹",function(){py--;rb();}));
    var yl=document.createElement("span");yl.style.cssText="font-size:16px;font-weight:700;color:#191F28;";yl.textContent=py+"년";yr.appendChild(yl);
    yr.appendChild(arrowBtn("›",function(){py++;rb();}));wrap.appendChild(yr);
    var grid=document.createElement("div");grid.style.cssText="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;";
    MONTHS.forEach(function(m,i){(function(mi){var btn=document.createElement("button");btn.style.cssText="padding:10px 0;background:"+(py===year&&i===month?"#3182F6":"#F2F4F6")+";border:none;border-radius:10px;color:"+(py===year&&i===month?"#fff":"#4E5968")+";font-size:14px;cursor:pointer;font-weight:"+(py===year&&i===month?"700":"400")+";";btn.textContent=m;btn.addEventListener("click",function(){onSel(py,mi);});grid.appendChild(btn);})(i);});wrap.appendChild(grid);
  }
  rb();return wrap;
}

/* ── RENDER LOOP */
function render(){
  var s=STATE,root=document.getElementById("root");root.innerHTML="";
  var e;
  if(!s.masterOk)e=renderMasterPw();
  else if(!s.fbLoaded)e=renderLoading();
  else e=renderShell();
  root.appendChild(e);
}

sub(render);render();
</script>
